name: Daily DSC expiry alerts
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 09:30 IST (GitHub may start it a few minutes late)
  workflow_dispatch: {}    # Actions tab -> Run workflow, for manual testing

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the Render service (free tier sleeps when idle)
        run: curl -sS --max-time 60 "${{ secrets.CLOUD_API_URL }}/health" || true
      - name: Send alerts
        run: |
          curl -fsS --max-time 60 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST "${{ secrets.CLOUD_API_URL }}/notifications/send-daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
